name: Daily AI Stock Research Report

on:
  schedule:
    # 7:00 AM Asia/Taipei is 23:00 UTC on the previous calendar day.
    - cron: '0 23 * * *'
    # 8:30 PM Asia/Taipei is 12:30 UTC.
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      report_mode:
        description: 'Report mode to generate'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve report mode
        id: report-mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=${{ inputs.report_mode }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "30 12 * * *" ]]; then
            echo "mode=evening" >> "$GITHUB_OUTPUT"
          else
            echo "mode=morning" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate daily research report
        run: npm run "automation:${{ steps.report-mode.outputs.mode }}"
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FINANCIAL_DATA_API_KEY: ${{ secrets.FINANCIAL_DATA_API_KEY }}

      - name: Commit generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest*.json data/reports/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore: update ${{ steps.report-mode.outputs.mode }} stock research report"
            git push
          fi
